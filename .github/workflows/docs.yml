name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Builds the documentation to catch errors. It is not published (this fork
# has no GitHub Pages site); see doc/index.rst or build it locally with
# "sphinx-build -b html doc docs".
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx

      - name: Build HTML documentation
        run: |
          sphinx-build -b html doc docs
